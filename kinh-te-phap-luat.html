        --panel-strong: rgba(245, 243, 255, 0.07);
        --panel-border: rgba(245, 243, 255, 0.1);
        --gold: #8b5cf6;
        --gold-bright: #a78bfa;
        --leaf: #6d28d9;
        --leaf-bright: #7c3aed;
        --rust: #1e1b4b;
        --rust-bright: #2e1065;
        --cream: #f5f3ff;
        --muted: #8b7cb0;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        font-size: 16.5px;
        background:
          radial-gradient(
            60% 50% at 15% 0%,
            rgba(139, 92, 246, 0.1),
            transparent 60%
          ),
          radial-gradient(
            55% 45% at 100% 100%,
            rgba(109, 40, 217, 0.14),
            transparent 60%
          ),
          linear-gradient(
            155deg,
            var(--bg-2) 0%,
            var(--bg-1) 55%,
            var(--bg-3) 100%

        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--cream);

      .font-display {
        font-family: "Fraunces", serif;
        font-optical-sizing: auto;
      }
      .glass {
        background: var(--panel);
        backdrop-filter: blur(18px);
        border: 1px solid var(--panel-border);
      }
      .glass-card {
        background: var(--panel-strong);
        backdrop-filter: blur(22px);
        border: 1px solid var(--panel-border);
        box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6);
        transition:
          box-shadow 0.4s ease,
          transform 0.4s ease;
      }
      .opt-btn {
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        border: 1px solid var(--panel-border);
        background: rgba(230, 224, 200, 0.03);
      }
      .opt-btn:hover {
        transform: translateX(5px);
        background: rgba(207, 158, 63, 0.08);
        border-color: rgba(207, 158, 63, 0.35);
      }
      .opt-btn.selected {
        background: linear-gradient(135deg, var(--gold), #b3822d) !important;
        border-color: var(--gold-bright) !important;
        color: #20140a !important;
        transform: translateX(5px);
        box-shadow: 0 6px 22px -6px rgba(207, 158, 63, 0.5);
      }
      .opt-btn.correct {
        background: linear-gradient(135deg, var(--leaf), #3f7a2a) !important;
        border-color: var(--leaf-bright) !important;
        color: #0d1a08 !important;
        box-shadow: 0 6px 22px -6px rgba(95, 154, 68, 0.5);
      }
      .opt-btn.wrong {
        background: linear-gradient(135deg, var(--rust), #8f3a26) !important;
        border-color: var(--rust-bright) !important;
        color: #fff !important;
        box-shadow: 0 6px 22px -6px rgba(182, 83, 58, 0.5);
      }
      .opt-btn.disabled {
        opacity: 0.65;
        cursor: default;
        transform: none !important;
      }
      .opt-badge {
        transition: all 0.25s ease;
      }
      .tf-btn {
        transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        min-width: 84px;
        text-align: center;
        border: 1px solid var(--panel-border);
        background: rgba(230, 224, 200, 0.04);
      }
      .tf-btn:hover {
        transform: scale(1.04);
      }
      .tf-btn.selected-true {
        background: linear-gradient(135deg, var(--leaf), #3f7a2a) !important;
        border-color: var(--leaf-bright) !important;
        color: #0d1a08 !important;
        box-shadow: 0 5px 16px -4px rgba(95, 154, 68, 0.5);
      }
      .tf-btn.selected-false {
        background: linear-gradient(135deg, var(--rust), #8f3a26) !important;
        border-color: var(--rust-bright) !important;
        color: #fff !important;
        box-shadow: 0 5px 16px -4px rgba(182, 83, 58, 0.5);
      }
      .tf-btn.reveal-true {
        background: linear-gradient(135deg, var(--leaf), #3f7a2a) !important;
        border-color: var(--leaf-bright) !important;
        color: #0d1a08 !important;
      }
      .tf-btn.reveal-false {
        background: linear-gradient(135deg, var(--rust), #8f3a26) !important;
        border-color: var(--rust-bright) !important;
        color: #fff !important;
      }
      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(22px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-in {
        animation: fadeSlideUp 0.45s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-in {
        animation: fadeIn 0.35s ease forwards;
      }
      @keyframes glow {
        0%,
        100% {
          box-shadow: 0 0 0 rgba(207, 158, 63, 0);
        }
        50% {
          box-shadow: 0 0 26px rgba(207, 158, 63, 0.28);
        }
      }
      .glow {
        animation: glow 2.8s ease-in-out infinite;
      }
      @keyframes sway {
        0%,
        100% {
          transform: translateX(-50%) rotate(-3deg);
        }
        50% {
          transform: translateX(-50%) rotate(3deg);
        }
      }
      .sway {
        animation: sway 3.2s ease-in-out infinite;
        transform-origin: bottom center;
      }

        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(230, 224, 200, 0.03);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(230, 224, 200, 0.12);
        border-radius: 3px;

      textarea:focus {

        box-shadow: 0 0 0 2px var(--gold);
        border-color: var(--gold) !important;
      }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--gold-bright);
      }
      .circle-bg {
        position: fixed;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.14;
        pointer-events: none;
        z-index: 0;
      }
    </style>

          type: "mcq",
          part: "I. Trắc nghiệm",
          q: "Cơ quan nào sau đây do nhân dân địa phương trực tiếp bầu ra?",
          opts: [
            "A. Viện kiểm sát nhân dân.",
            "B. Tòa án nhân dân.",
            "C. Ủy ban nhân dân.",
            "D. Hội đồng nhân dân.",
          ],
          ans: 3,
        },
        {
          type: "mcq",
          part: "I. Trắc nghiệm",
          q: "Theo quy định của pháp luật, trong thông tin trên chủ thể nào không vi phạm pháp luật?",
          opts: ["A. Anh K.", "B. Chị A.", "C. Chồng chị L.", "D. Chị L."],
          ans: 3,
        },
        {
          type: "mcq",
          part: "I. Trắc nghiệm",
          q: "Trong thông tin trên, những ai đã thực hiện chưa tốt trách nhiệm của công dân trong tham gia xây dựng và hoàn thiện hệ thống chính trị ở cơ sở?",
          opts: [
            "A. Chị L, chị G và chị A.",
            "B. Vợ chồng chị L.",
            "C. Anh K và chị L.",
            "D. Anh K, chị A và chị G.",
          ],
          ans: 3,
        },
        {
          type: "tf",
          part: "II. Đúng / Sai",
          q: "Câu 1. Hệ thống chính trị ở xã, phường, thị trấn bao gồm các thành tố có vai trò quan trọng trong thực hiện nhiệm vụ chính trị tại địa phương.",
          sub: [
            {
              text: "a) Đoàn thanh niên xã là một thành viên trong hệ thống chính trị ở xã.",
              ans: true,
            },
            {
              text: "b) Hệ thống chính trị ở xã được tổ chức linh hoạt căn cứ vào từng vùng miền.",
              ans: false,
            },
            {
              text: "c) Ủy ban nhân dân xã là tổ chức chính quyền thấp nhất hiện nay.",
              ans: true,
            },
            {
              text: "d) Mặt trận Tổ quốc không thuộc hệ thống chính trị ở cơ sở.",
              ans: false,
            },
          ],
        },
        {
          type: "tf",
          part: "II. Đúng / Sai",
          q: "Câu 2. Quyền lực nhà nước Việt Nam được phân công cho các cơ quan, cá nhân nhất định, không tập trung vào một cơ quan hay một cá nhân duy nhất.",
          sub: [
            {
              text: "a) Cơ quan cấp dưới phục tùng cơ quan cấp trên là thể hiện nguyên tắc tập trung dân chủ.",
              ans: true,
            },
            {
              text: "b) Việc hỗ trợ nhau giữa các cơ quan trong bộ máy nhà nước thể hiện tính thống nhất.",
              ans: true,
            },
            {
              text: "c) Các cơ quan trong bộ máy nhà nước là các cơ quan quyền lực của nhà nước.",
              ans: false,
            },
            {
              text: "d) Mọi cơ quan trong bộ máy phải tuân theo pháp luật là thể hiện tính pháp chế.",
              ans: true,
            },
          ],
        },
        {
          type: "essay",
          part: "III. Tự luận",
          q: "Câu 1. (2,0 điểm)\nTình huống: Tại huyện X, cơ quan Công an điều tra vụ trộm cắp tại cửa hàng điện thoại của bà H và xác định ông M là người thực hiện hành vi phạm tội. Ông M bị khởi tố và tạm giam để phục vụ điều tra. Sau khi kết thúc điều tra, hồ sơ vụ án được chuyển sang Viện kiểm sát nhân dân Việt Nam, cơ quan này đã quyết định truy tố ông M ra trước Tòa án nhân dân. Tại phiên tòa sơ thẩm, Hội đồng xét xử tiến hành xét hỏi. Ông K (đại diện Viện kiểm sát), đọc cáo trạng, tham gia xét hỏi và theo dõi phiên tòa nhằm đảm bảo việc xét xử đúng quy định pháp luật, đồng thời đề nghị mức án đối với bị cáo.\n\na) Từ tình huống trên, hãy nhận xét vai trò của Tòa án nhân dân trong việc giải quyết vụ án.\nb) Nếu tại phiên tòa không có đại diện Viện kiểm sát nhân dân Việt Nam tham gia thì việc xét xử có thể bị ảnh hưởng như thế nào?",
          sample:
            "Tòa án nhân dân thực hiện quyền tư pháp, xét xử độc lập và chỉ tuân theo pháp luật, đảm bảo công lý và quyền con người. Viện kiểm sát tham gia phiên tòa với vai trò thực hành quyền công tố và kiểm sát hoạt động xét xử, đảm bảo việc xét xử đúng quy định pháp luật. Nếu không có Viện kiểm sát, việc xét xử có thể thiếu tính khách quan, công bằng và không đảm bảo tuân thủ pháp luật.",
        },
        {
          type: "essay",
          part: "III. Tự luận",
          q: "Câu 2. (1,0 điểm)\nVì sao cần có sự phân công giữa Quốc hội Việt Nam, Chủ tịch nước Việt Nam và Chính phủ Việt Nam trong bộ máy nhà nước?",
          sample:
            "Phân công giữa Quốc hội, Chủ tịch nước và Chính phủ nhằm đảm bảo quyền lực nhà nước được thực hiện thống nhất, tránh tập trung quyền lực tuyệt đối vào một cơ quan; đồng thời tạo sự chuyên môn hóa, nâng cao hiệu quả hoạt động. Quốc hội lập pháp, Chủ tịch nước là người đứng đầu nhà nước, Chính phủ hành pháp — mỗi cơ quan thực hiện chức năng riêng nhưng phối hợp chặt chẽ.",
        },
      ];

      let current = 0,
        confirmado = false,
        results = [];
      const qArea = document.getElementById("question-content"),
        fbArea = document.getElementById("feedback-area"),
        btnArea = document.getElementById("btn-area");
      const progressBar = document.getElementById("progress-bar"),
        progressText = document.getElementById("progress-text"),
        progressLeaf = document.getElementById("progress-leaf");

      function updateProgress(pct) {
        const p =
          pct !== undefined ? pct : ((current + 1) / QUESTIONS.length) * 100;
        progressBar.style.width = p + "%";
        progressLeaf.style.left = p + "%";
        progressText.textContent =
          pct !== undefined
            ? "Hoàn thành!"
            : `${current + 1} / ${QUESTIONS.length}`;
      }
      function retriggerAnim() {
        const area = document.getElementById("question-area");
        area.classList.remove("animate-in");
        void area.offsetWidth;
        area.classList.add("animate-in");
      }
      function showFeedback(html, tone) {
        const colors = {
          warn: "color:var(--gold-bright); background:rgba(207,158,63,0.10); border-color:rgba(207,158,63,0.28);",
          good: "color:var(--leaf-bright); background:rgba(95,154,68,0.10); border-color:rgba(95,154,68,0.28);",
          bad: "color:var(--rust-bright); background:rgba(182,83,58,0.10); border-color:rgba(182,83,58,0.28);",
        };
        fbArea.classList.remove("hidden");
        fbArea.classList.remove("fade-in");
        void fbArea.offsetWidth;
        fbArea.classList.add("fade-in");
        fbArea.innerHTML = `<div class="flex items-center gap-2 rounded-xl p-3 border" style="${colors[tone]}">${html}</div>`;
      }
      function render() {
        confirmado = false;
        const q = QUESTIONS[current];
        updateProgress();
        fbArea.classList.add("hidden");
        fbArea.innerHTML = "";
        let html = `<div class="flex items-center gap-2 text-xs font-semibold tracking-wide mb-4" style="color:var(--gold-bright)"><span style="opacity:.7">◆</span> ${q.part}</div>`;
        if (q.type === "mcq") {
          html += `<p class="font-display text-xl leading-relaxed mb-5" style="color:var(--cream)">${q.q}</p><div class="space-y-2.5" id="mcq-opts">`;
          q.opts.forEach(
            (o, i) =>
              (html += `<div class="opt-btn rounded-xl px-5 py-3.5 flex items-center gap-3" onclick="selectMCQ(${i})"><span class="opt-badge w-8 h-8 rounded-full border-2 flex items-center justify-center text-xs font-bold flex-shrink-0" style="border-color:rgba(230,224,200,0.18); background:rgba(230,224,200,0.05);">${LETTERS[i]}</span><span class="text-[17px]">${o.replace(/^[A-Z]\.\s*/, "")}</span></div>`),
          );
          html += "</div>";
          qArea.innerHTML = html;
          window._mcqSelected = undefined;
          btnArea.innerHTML = `<button onclick="confirmMCQ()" class="px-8 py-3 rounded-xl font-semibold transition-all duration-300 glow flex items-center gap-2" style="background:linear-gradient(135deg,var(--gold),#b3822d); color:#20140a;">Xác nhận ${ICON.arrow}</button>`;
        } else if (q.type === "tf") {
          html += `<p class="font-display text-xl font-semibold mb-4" style="color:var(--cream)">${q.q}</p><div class="space-y-3">`;
          q.sub.forEach(
            (item, si) =>
              (html += `<div class="flex flex-col sm:flex-row sm:items-center gap-3 p-3.5 rounded-xl" style="background:rgba(230,224,200,0.035); border:1px solid rgba(230,224,200,0.06);" id="tf-row-${si}"><span class="flex-1 flex items-center gap-2"><span class="w-5 h-5 flex items-center justify-center flex-shrink-0" id="tf-status-${si}"></span>${item.text}</span><div class="flex gap-2" id="tf-${si}"><button class="tf-btn px-5 py-2 rounded-xl text-sm font-semibold" onclick="selectTF(${si},true)">Đúng</button><button class="tf-btn px-5 py-2 rounded-xl text-sm font-semibold" onclick="selectTF(${si},false)">Sai</button></div></div>`),
          );
          html += "</div>";
          qArea.innerHTML = html;
          window._tfSelected = {};
          btnArea.innerHTML = `<button onclick="confirmTF()" class="px-8 py-3 rounded-xl font-semibold transition-all duration-300 glow flex items-center gap-2" style="background:linear-gradient(135deg,var(--gold),#b3822d); color:#20140a;">Xác nhận ${ICON.arrow}</button>`;
        } else if (q.type === "essay") {
          html += `<p class="font-display text-xl leading-relaxed mb-4" style="color:var(--cream)">${q.q}</p><textarea id="essay-input" rows="6" class="w-full rounded-xl p-4 resize-y leading-relaxed" style="background:rgba(230,224,200,0.04); border:1px solid rgba(230,224,200,0.14); color:var(--cream);" placeholder="Nhập câu trả lời của bạn..."></textarea>`;
          qArea.innerHTML = html;
          btnArea.innerHTML = `<button onclick="confirmEssay()" class="px-8 py-3 rounded-xl font-semibold transition-all duration-300 glow flex items-center gap-2" style="background:linear-gradient(135deg,var(--gold),#b3822d); color:#20140a;">Xác nhận ${ICON.arrow}</button>`;
        }
        retriggerAnim();
      }
      function selectMCQ(i) {
        if (confirmado) return;
        if (window._mcqSelected !== undefined)
          document
            .querySelectorAll("#mcq-opts .opt-btn")
            [window._mcqSelected].classList.remove("selected");
        window._mcqSelected = i;
        document
          .querySelectorAll("#mcq-opts .opt-btn")
          [i].classList.add("selected");
      }
      function confirmMCQ() {
        if (window._mcqSelected === undefined) {
          showFeedback(`${ICON.alert} Vui lòng chọn đáp án.`, "warn");
          return;
        }
        confirmado = true;
        const q = QUESTIONS[current];
        const btns = document.querySelectorAll("#mcq-opts .opt-btn");
        btns.forEach((b, i) => {
          b.classList.remove("selected");
          const badge = b.querySelector(".opt-badge");
          if (i === q.ans) {
            b.classList.add("correct");
            badge.innerHTML = ICON.check;
          }
          if (i === window._mcqSelected && i !== q.ans) {
            b.classList.add("wrong");
            badge.innerHTML = ICON.x;
          }
          b.classList.add("disabled");
          b.onclick = null;
        });
        const ok = window._mcqSelected === q.ans;
        results[current] = ok;
        showFeedback(
          ok
            ? `${ICON.check} <span class="font-semibold">Chính xác!</span>`
            : `${ICON.x} <span class="font-semibold">Sai.</span> Đáp án: ${q.opts[q.ans]}`,
          ok ? "good" : "bad",
        );
        showNextBtn();
      }
      function selectTF(si, val) {
        if (confirmado) return;
        const btns = document.querySelectorAll(`#tf-${si} button`);
        btns.forEach((b) =>
          b.classList.remove("selected-true", "selected-false"),
        );
        btns.forEach((b) => {
          if (b.textContent === "Đúng")
            b.classList.toggle("selected-true", val === true);
          else b.classList.toggle("selected-false", val === false);
        });
        window._tfSelected[si] = val;
      }
      function confirmTF() {
        const q = QUESTIONS[current];
        let all = true;
        q.sub.forEach((_, si) => {
          if (window._tfSelected[si] === undefined) all = false;
        });
        if (!all) {
          showFeedback(`${ICON.alert} Chọn Đ/S cho tất cả ý.`, "warn");
          return;
        }
        confirmado = true;
        let correct = 0;
        q.sub.forEach((item, si) => {
          const btns = document.querySelectorAll(`#tf-${si} button`);
          btns.forEach((b) => {
            b.classList.remove("selected-true", "selected-false");
            const bVal = b.textContent === "Đúng";
            b.classList.add(bVal === item.ans ? "reveal-true" : "reveal-false");
            b.style.cursor = "default";
            b.onclick = null;
          });
          const status = document.getElementById(`tf-status-${si}`);
          const userOk = window._tfSelected[si] === item.ans;
          status.style.color = userOk
            ? "var(--leaf-bright)"
            : "var(--rust-bright)";
          status.innerHTML = userOk ? ICON.check : ICON.x;
          if (userOk) correct++;
        });
        results[current] = correct;
        showFeedback(
          `${ICON.check} <span class="font-semibold">Đúng ${correct}/4 ý.</span>`,
          correct === 4 ? "good" : "warn",
        );
        showNextBtn();
      }
      function confirmEssay() {
        const input = document.getElementById("essay-input");
        const u = input.value.trim();
        if (!u) {
          showFeedback(`${ICON.alert} Nhập câu trả lời.`, "warn");
          return;
        }
        confirmado = true;
        const q = QUESTIONS[current];
        const s = q.sample;
        const norm = (x) => x.replace(/\s+/g, " ").trim().toLowerCase();
        const uN = norm(u),
          sN = norm(s);
        const words = new Set(
          sN.split(/[^a-z0-9_\u00e0-\u00ff]+/).filter(Boolean),
        );
        const uw = uN.split(/[^a-z0-9_\u00e0-\u00ff]+/).filter(Boolean);
        const matched = uw.filter((w) => words.has(w)).length;
        const ratio =
          words.size > 0 ? Math.round((matched / words.size) * 100) : 0;
        results[current] = ratio;
        const tone = ratio >= 80 ? "good" : ratio >= 50 ? "warn" : "bad";
        const barColor =
          ratio >= 80
            ? "var(--leaf)"
            : ratio >= 50
              ? "var(--gold)"
              : "var(--rust)";
        fbArea.classList.remove("hidden");
        fbArea.classList.remove("fade-in");
        void fbArea.offsetWidth;
        fbArea.classList.add("fade-in");
        fbArea.innerHTML = `<div class="rounded-xl p-4 border" style="${tone === "good" ? "color:var(--leaf-bright); background:rgba(95,154,68,0.10); border-color:rgba(95,154,68,0.28);" : tone === "warn" ? "color:var(--gold-bright); background:rgba(207,158,63,0.10); border-color:rgba(207,158,63,0.28);" : "color:var(--rust-bright); background:rgba(182,83,58,0.10); border-color:rgba(182,83,58,0.28);"}">
        <div class="flex items-center gap-2">${ICON.chart}<span class="font-semibold">Độ tương đồng: ${ratio}%</span></div>
        <p class="text-sm mt-1" style="color:var(--muted)">Từ khóa khớp: ${matched}/${words.size}</p>
        <div class="w-full rounded-full h-1.5 mt-2" style="background:rgba(230,224,200,0.08)"><div class="h-full rounded-full transition-all duration-700 ease-out" style="width:${ratio}%; background:${barColor};"></div></div>
        <button onclick="document.getElementById('essay-input').value='${s.replace(/`/g, "\\`").replace(/'/g, "\\'").replace(/\n/g, "\\n")}'" class="mt-3 text-sm underline flex items-center gap-1" style="color:var(--gold-bright)">${ICON.edit} Điền đáp án mẫu</button>
      </div>`;
        showNextBtn();
      }
      function showNextBtn() {
        const last = current === QUESTIONS.length - 1;
        btnArea.innerHTML = last
          ? `<button onclick="showResults()" class="px-8 py-3 rounded-xl font-semibold transition-all duration-300 glow flex items-center gap-2" style="background:linear-gradient(135deg,var(--leaf),#3f7a2a); color:#0d1a08;">Xem kết quả ${ICON.chart}</button>`
          : `<button onclick="next()" class="px-8 py-3 rounded-xl font-semibold transition-all duration-300 glow flex items-center gap-2" style="background:linear-gradient(135deg,var(--gold),#b3822d); color:#20140a;">Tiếp theo ${ICON.arrow}</button>`;
      }
      function next() {
        current++;
        render();
      }
      function showResults() {
        let mcqC = 0,
          mcqT = 0,
          tfC = 0,
          tfT = 0,
          essS = 0,
          essT = 0;
        QUESTIONS.forEach((q, i) => {
          const r = results[i];
          if (r === undefined) return;
          if (q.type === "mcq") {
            if (r) mcqC++;
            mcqT++;
          } else if (q.type === "tf") {
            tfC += r;
            tfT += 4;
          } else if (q.type === "essay") {
            essS += r;
            essT++;
          }
        });
        qArea.innerHTML = `<div class="text-center py-8">
        <div class="flex justify-center mb-4">${ICON.sprout}</div>
        <h2 class="font-display text-3xl font-semibold" style="color:var(--cream)">Hoàn thành!</h2>
        <p class="mt-2" style="color:var(--muted)">Kết quả làm bài của bạn</p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-8">
          <div class="glass rounded-2xl p-5"><p class="text-2xl font-bold" style="color:var(--gold-bright)">${mcqC}/${mcqT}</p><p class="text-xs mt-1" style="color:var(--muted)">Trắc nghiệm</p></div>
          <div class="glass rounded-2xl p-5"><p class="text-2xl font-bold" style="color:var(--leaf-bright)">${tfC}/${tfT}</p><p class="text-xs mt-1" style="color:var(--muted)">Đúng / Sai</p></div>
          <div class="glass rounded-2xl p-5"><p class="text-2xl font-bold" style="color:var(--cream)">${essT > 0 ? Math.round(essS / essT) + "%" : "--"}</p><p class="text-xs mt-1" style="color:var(--muted)">Tự luận</p></div>
        </div>
      </div>`;
        fbArea.classList.add("hidden");
        btnArea.innerHTML = `<button onclick="restart()" class="px-8 py-3 rounded-xl font-semibold transition-all duration-300 glow flex items-center gap-2" style="background:linear-gradient(135deg,var(--gold),#b3822d); color:#20140a;">Làm lại ${ICON.refresh}</button>`;
        updateProgress(100);
        retriggerAnim();
      }
      function restart() {
        current = 0;
        confirmado = false;
        results = [];
        render();
      }
      render();
    </script>
  </body>
</html>
