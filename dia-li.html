<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Địa lý 11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: #0c150e;
        --bg-2: #1c130a;
        --bg-3: #0a141e;
        --panel: rgba(236, 254, 255, 0.045);
        --panel-strong: rgba(236, 254, 255, 0.07);
        --panel-border: rgba(236, 254, 255, 0.1);
        --gold: #0891b2;
        --gold-bright: #22d3ee;
        --leaf: #0e7490;
        --leaf-bright: #06b6d4;
        --rust: #164e63;
        --rust-bright: #155e75;
        --cream: #ecfeff;
        --muted: #5c8b94;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        font-size: 16.5px;
        background:
          radial-gradient(60% 50% at 15% 0%, rgba(8, 145, 178, 0.1), transparent 60%),
          radial-gradient(55% 45% at 100% 100%, rgba(14, 116, 144, 0.14), transparent 60%),
          linear-gradient(155deg, var(--bg-2) 0%, var(--bg-1) 55%, var(--bg-3) 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--cream);
      }
      .font-display { font-family: "Fraunces", serif; font-optical-sizing: auto; }
      .glass { background: var(--panel); backdrop-filter: blur(18px); border: 1px solid var(--panel-border); }
      .glass-card {
        background: var(--panel-strong);
        backdrop-filter: blur(22px);
        border: 1px solid var(--panel-border);
        box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6);
        transition: box-shadow 0.4s ease, transform 0.4s ease;
      }
      .opt-btn {
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        border: 1px solid var(--panel-border);
        background: rgba(230, 224, 200, 0.03);
      }
      .opt-btn:hover { transform: translateX(5px); background: rgba(207, 158, 63, 0.08); border-color: rgba(207, 158, 63, 0.35); }
      .opt-btn.selected {
        background: linear-gradient(135deg, var(--gold), #b3822d) !important;
        border-color: var(--gold-bright) !important;
        color: #20140a !important;
        transform: translateX(5px);
        box-shadow: 0 6px 22px -6px rgba(207, 158, 63, 0.5);
      }
      .opt-btn.correct {
        background: linear-gradient(135deg, var(--leaf), #3f7a2a) !important;
        border-color: var(--leaf-bright) !important;
        color: #0d1a08 !important;
        box-shadow: 0 6px 22px -6px rgba(95, 154, 68, 0.5);
      }
      .opt-btn.wrong {
        background: linear-gradient(135deg, var(--rust), #8f3a26) !important;
        border-color: var(--rust-bright) !important;
        color: #fff !important;
        box-shadow: 0 6px 22px -6px rgba(182, 83, 58, 0.5);
      }
      .opt-btn.disabled { opacity: 0.65; cursor: default; transform: none !important; }
      .opt-badge { transition: all 0.25s ease; }
      .tf-btn {
        transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        min-width: 84px;
        text-align: center;
        border: 1px solid var(--panel-border);
        background: rgba(230, 224, 200, 0.04);
      }
      .tf-btn:hover { transform: scale(1.04); }
      .tf-btn.selected-true {
        background: linear-gradient(135deg, var(--leaf), #3f7a2a) !important;
        border-color: var(--leaf-bright) !important;
        color: #0d1a08 !important;
        box-shadow: 0 5px 16px -4px rgba(95, 154, 68, 0.5);
      }
      .tf-btn.selected-false {
        background: linear-gradient(135deg, var(--rust), #8f3a26) !important;
        border-color: var(--rust-bright) !important;
        color: #fff !important;
        box-shadow: 0 5px 16px -4px rgba(182, 83, 58, 0.5);
      }
      .tf-btn.reveal-true {
        background: linear-gradient(135deg, var(--leaf), #3f7a2a) !important;
        border-color: var(--leaf-bright) !important;
        color: #0d1a08 !important;
      }
      .tf-btn.reveal-false {
        background: linear-gradient(135deg, var(--rust), #8f3a26) !important;
        border-color: var(--rust-bright) !important;
        color: #fff !important;
      }
      @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(22px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .animate-in { animation: fadeSlideUp 0.45s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .fade-in { animation: fadeIn 0.35s ease forwards; }
      @keyframes glow { 0%, 100% { box-shadow: 0 0 0 rgba(207, 158, 63, 0); } 50% { box-shadow: 0 0 26px rgba(207, 158, 63, 0.28); } }
      .glow { animation: glow 2.8s ease-in-out infinite; }
      @keyframes sway { 0%, 100% { transform: translateX(-50%) rotate(-3deg); } 50% { transform: translateX(-50%) rotate(3deg); } }
      .sway { animation: sway 3.2s ease-in-out infinite; transform-origin: bottom center; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: rgba(230, 224, 200, 0.03); }
      ::-webkit-scrollbar-thumb { background: rgba(230, 224, 200, 0.12); border-radius: 3px; }
      textarea:focus { outline: none; box-shadow: 0 0 0 2px var(--gold); border-color: var(--gold) !important; }
      button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--gold-bright); }
      .circle-bg { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.14; pointer-events: none; z-index: 0; }
    </style>
  </head>
  <body class="p-4">
    <div class="circle-bg w-[420px] h-[420px] top-[-110px] left-[-110px]" style="background: var(--gold)"></div>
    <div class="circle-bg w-[320px] h-[320px] bottom-[-60px] right-[-60px]" style="background: var(--leaf)"></div>

    <div class="w-full max-w-2xl mx-auto relative z-10">
      <div class="glass rounded-2xl px-6 py-5 mb-5">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--gold-bright)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
            <span class="font-display text-lg tracking-wide" style="color: var(--cream)">Địa lý 11</span>
          </div>
          <p class="text-xs font-semibold tracking-wide" style="color: var(--muted)" id="progress-text">0 / 0</p>
        </div>
        <div class="relative mx-3" style="height: 24px">
          <div class="w-full h-[6px] rounded-full overflow-hidden absolute top-1/2" style="transform: translateY(-50%); background: rgba(230, 224, 200, 0.08);">
            <div class="h-full rounded-full" id="progress-bar" style="width: 0%; background: linear-gradient(90deg, var(--leaf), var(--gold)); transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);"></div>
          </div>
          <div class="absolute top-1/2" id="progress-leaf" style="left: 0%; transition: left 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform: translate(-50%, -50%);">
            <div class="w-6 h-6 rounded-full flex items-center justify-center" style="background: radial-gradient(circle at 32% 28%, var(--gold-bright), var(--gold)); box-shadow: 0 3px 10px -2px rgba(207, 158, 63, 0.6);">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#20140a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
            </div>
          </div>
        </div>
      </div>

      <div id="question-area" class="glass-card rounded-[26px] p-6 sm:p-7 min-h-[280px] animate-in relative">
        <div id="question-content"></div>
        <div id="feedback-area" class="mt-5 hidden"></div>
        <div id="btn-area" class="mt-6 flex justify-end gap-3"></div>
      </div>
    </div>

    <script>
      const ICON = {
        check: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
        x: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
        alert: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>`,
        arrow: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
        refresh: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>`,
        chart: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M8 17V10M13 17V6M18 17v-4"/></svg>`,
        edit: `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
        sprout: `<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="var(--leaf-bright)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>`,
      };
      const LETTERS = ["A", "B", "C", "D", "E", "F"];

      const QUESTIONS = [
        { type: "mcq", part: "I. Trắc nghiệm", q: "Vấn đề nào quan trọng trong việc sử dụng tài nguyên nước ở Đông Nam Á?", opts: ["A. Xây đập thủy điện", "B. Thỏa thuận hợp tác sông Mê Công", "C. Ngăn lũ lụt", "D. Kiểm soát hạn hán"], ans: 1 },
        { type: "mcq", part: "I. Trắc nghiệm", q: "Xu hướng chung của việc sử dụng tài nguyên ở Đông Nam Á?", opts: ["A. Chỉ khai thác trong nước", "B. Sự hợp tác giữa các quốc gia", "C. Cạnh tranh gay gắt", "D. Chỉ phát triển thủy điện"], ans: 1 },
        { type: "mcq", part: "I. Trắc nghiệm", q: "Tổ chức nào thúc đẩy hợp tác khu vực Đông Nam Á?", opts: ["A. ASEAN", "B. EU", "C. NAFTA", "D. OPEC"], ans: 0 },
        { type: "mcq", part: "I. Trắc nghiệm", q: "Đặc điểm nào đúng với dân cư / xã hội Đông Nam Á?", opts: ["A. Ít dân tộc", "B. Phân bố đều", "C. Lao động dồi dào", "D. Thu nhập cao"], ans: 2 },
        { type: "mcq", part: "I. Trắc nghiệm", q: "Tác động tích cực của toàn cầu hóa đến Đông Nam Á?", opts: ["A. Mất bản sắc văn hóa", "B. Nhạy cảm kinh tế", "C. Mở rộng thị trường", "D. Ô nhiễm môi trường"], ans: 2 },
        { type: "mcq", part: "I. Trắc nghiệm", q: "Thách thức với kinh tế biển Đông Nam Á?", opts: ["A. Nhiều khoáng sản", "B. Nhiều hải sản", "C. Nước biển dâng", "D. Ít vịnh"], ans: 2 },
        { type: "mcq", part: "I. Trắc nghiệm", q: "Đặc điểm đô thị hóa ở Đông Nam Á?", opts: ["A. Tỉ lệ dân đô thị thấp", "B. Tốc độ chậm", "C. Đô thị hóa tự phát", "D. Đồng đều giữa các nước"], ans: 2 },
        { type: "mcq", part: "I. Trắc nghiệm", q: "Các dân tộc Đông Nam Á thuộc chủng tộc nào?", opts: ["A. Ơ-rô-pê-ô-it", "B. Môn-gô-lô-it và Ô-xtra-lô-it", "C. Nê-grô-it", "D. Môn-gô-lô-it"], ans: 1 },
        { type: "mcq", part: "I. Trắc nghiệm", q: "Biển Đông thuộc đại dương nào?", opts: ["A. Thái Bình Dương", "B. Ấn Độ Dương", "C. Đại Tây Dương", "D. Bắc Băng Dương"], ans: 0 },
        { type: "mcq", part: "I. Trắc nghiệm", q: "Đường cơ sở dùng để tính chiều rộng lãnh hải được xác định từ đâu?", opts: ["A. Đường mép nước TB", "B. Ranh giới ngoài lãnh hải", "C. Ngấn nước thủy triều thấp nhất dọc bờ biển", "D. Đường bờ biển hiện tại"], ans: 2 },
        { type: "mcq", part: "I. Trắc nghiệm", q: "Vùng biển nào sau đây không thuộc chủ quyền quốc gia?", opts: ["A. Lãnh hải", "B. Nội thủy", "C. Vùng đặc quyền kinh tế", "D. Vùng trời"], ans: 2 },
        { type: "mcq", part: "I. Trắc nghiệm", q: "Theo UNCLOS, lãnh hải rộng bao nhiêu hải lý?", opts: ["A. 10 hải lý", "B. 11 hải lý", "C. 12 hải lý", "D. 13 hải lý"], ans: 2 },
        { type: "mcq", part: "I. Trắc nghiệm", q: "Vùng biển nào nằm bên trong đường cơ sở?", opts: ["A. Lãnh hải", "B. Nội thủy", "C. Thềm lục địa", "D. Vùng tiếp giáp"], ans: 1 },
        { type: "mcq", part: "I. Trắc nghiệm", q: "Thềm lục địa có chiều rộng tối đa là?", opts: ["A. 150 hải lý", "B. 200 hải lý", "C. 250 hải lý", "D. 350 hải lý"], ans: 3 },
        { type: "mcq", part: "I. Trắc nghiệm", q: "Tỉnh nào có đường biên giới trên đất liền với Trung Quốc?", opts: ["A. Điện Biên, Lào Cai", "B. Lạng Sơn, Quảng Ninh", "C. Hà Giang, Điện Biên", "D. Tất cả đáp án"], ans: 3 },
        { type: "mcq", part: "I. Trắc nghiệm", q: "Vùng biển nào Việt Nam có chủ quyền hoàn toàn?", opts: ["A. Vùng đặc quyền KT", "B. Vùng tiếp giáp lãnh hải", "C. Nội thủy và lãnh hải", "D. Thềm lục địa"], ans: 2 },
        { type: "tf", part: "II. Đúng / Sai", q: "Câu 1. Về ASEAN:", sub: [
          { text: "a) Mục tiêu ASEAN là tăng cường hợp tác kinh tế, văn hóa, XH.", ans: true },
          { text: "b) ASEAN hạn chế hợp tác chính trị để tránh xung đột.", ans: false },
          { text: "c) ASEAN duy trì hòa bình ổn định khu vực.", ans: true },
          { text: "d) ASEAN chỉ gồm các nước Đông Nam Á lục địa.", ans: false }
        ]},
        { type: "tf", part: "II. Đúng / Sai", q: "Câu 2. Về biển Đông:", sub: [
          { text: "a) Một số nước gây tranh chấp ở Biển Đông.", ans: true },
          { text: "b) Biển Đông đã hoàn toàn hòa bình và ổn định.", ans: false },
          { text: "c) VN chủ trương giải quyết bằng hòa bình.", ans: true },
          { text: "d) Các nước tuân thủ UNCLOS 1982.", ans: true }
        ]},
        { type: "short", part: "III. Trả lời ngắn", q: "Câu 1. Phát triển bền vững hướng đến tối đa hóa điều gì? (≤4 kí tự)", ansWords: ["lợi nhuận"], maxLen: 4 },
        { type: "short", part: "III. Trả lời ngắn", q: "Câu 2. Hệ thống toàn cầu hóa thương mại dựa trên sự di chuyển tự do của yếu tố chính nào? (4 kí tự)", ansWords: ["vốn", "hàng hóa", "vốn và hàng hóa"], maxLen: 10 },
        { type: "short", part: "III. Trả lời ngắn", q: "Câu 3. Tiến bộ KHKT trong nông nghiệp ảnh hưởng trực tiếp đến sự gia tăng của yếu tố nào? (≤4 kí tự)", ansWords: ["năng suất"], maxLen: 9 },
        { type: "short", part: "III. Trả lời ngắn", q: "Câu 4. Để phát triển bền vững, cần kết hợp hài hòa những trụ cột nào? (≤4 kí tự mỗi trụ cột, trả lời 1)", ansWords: ["kinh tế", "xã hội", "môi trường", "kinh tế xã hội môi trường"], maxLen: 20 },
        { type: "essay", part: "IV. Tự luận", q: "Câu 1. (0,5đ + 0,5đ) Phân tích đặc điểm dân cư Đông Nam Á và ảnh hưởng đến phát triển KT-XH.", sample: "Đông Nam Á có dân số đông, cơ cấu dân số trẻ, lao động dồi dào, thị trường tiêu thụ lớn, tạo điều kiện phát triển kinh tế. Tuy nhiên, dân cư phân bố không đều, tập trung ở đồng bằng và ven biển, trong khi miền núi thưa thớt, gây khó khăn cho phát triển đồng đều. Sự đa dạng về dân tộc, tôn giáo và văn hóa vừa là lợi thế cho du lịch và hợp tác quốc tế, vừa là thách thức trong quản lý xã hội." },
        { type: "essay", part: "IV. Tự luận", q: "Câu 2. (1đ) Phân tích các cơ hội và thách thức của Đông Nam Á trong toàn cầu hóa và hội nhập kinh tế.", sample: "Cơ hội: Mở rộng thị trường xuất khẩu, thu hút đầu tư nước ngoài, tiếp cận công nghệ hiện đại, gia tăng hợp tác quốc tế, phát triển cơ sở hạ tầng. Thách thức: Cạnh tranh gay gắt từ các nền kinh tế lớn, nguy cơ mất bản sắc văn hóa, gia tăng bất bình đẳng thu nhập, ô nhiễm môi trường, phụ thuộc vào thị trường bên ngoài, biến đổi khí hậu ảnh hưởng đến sản xuất nông nghiệp." }
      ];

      let current = 0, confirmado = false, results = [];
      const qArea = document.getElementById("question-content"), fbArea = document.getElementById("feedback-area"), btnArea = document.getElementById("btn-area");
      const progressBar = document.getElementById("progress-bar"), progressText = document.getElementById("progress-text"), progressLeaf = document.getElementById("progress-leaf");

      function updateProgress(pct) {
        const p = pct !== undefined ? pct : ((current + 1) / QUESTIONS.length) * 100;
        progressBar.style.width = p + "%";
        progressLeaf.style.left = p + "%";
        progressText.textContent = pct !== undefined ? "Hoàn thành!" : `${current + 1} / ${QUESTIONS.length}`;
      }
      function retriggerAnim() { const area = document.getElementById("question-area"); area.classList.remove("animate-in"); void area.offsetWidth; area.classList.add("animate-in"); }
      function showFeedback(html, tone) {
        const colors = { warn: "color:var(--gold-bright); background:rgba(207,158,63,0.10); border-color:rgba(207,158,63,0.28);", good: "color:var(--leaf-bright); background:rgba(95,154,68,0.10); border-color:rgba(95,154,68,0.28);", bad: "color:var(--rust-bright); background:rgba(182,83,58,0.10); border-color:rgba(182,83,58,0.28);" };
        fbArea.classList.remove("hidden"); fbArea.classList.remove("fade-in"); void fbArea.offsetWidth; fbArea.classList.add("fade-in");
        fbArea.innerHTML = `<div class="flex items-center gap-2 rounded-xl p-3 border" style="${colors[tone]}">${html}</div>`;
      }
      function render() {
        confirmado = false; const q = QUESTIONS[current]; updateProgress();
        fbArea.classList.add("hidden"); fbArea.innerHTML = "";
        let html = `<div class="flex items-center gap-2 text-xs font-semibold tracking-wide mb-4" style="color:var(--gold-bright)"><span style="opacity:.7">◆</span> ${q.part}</div>`;
        if (q.type === "mcq") {
          html += `<p class="font-display text-xl leading-relaxed mb-5" style="color:var(--cream)">${q.q}</p><div class="space-y-2.5" id="mcq-opts">`;
          q.opts.forEach((o, i) => (html += `<div class="opt-btn rounded-xl px-5 py-3.5 flex items-center gap-3" onclick="selectMCQ(${i})"><span class="opt-badge w-8 h-8 rounded-full border-2 flex items-center justify-center text-xs font-bold flex-shrink-0" style="border-color:rgba(230,224,200,0.18); background:rgba(230,224,200,0.05);">${LETTERS[i]}</span><span class="text-[17px]">${o.replace(/^[A-Z]\.\s*/, "")}</span></div>`));
          html += "</div>"; qArea.innerHTML = html; window._mcqSelected = undefined;
          btnArea.innerHTML = `<button onclick="confirmMCQ()" class="px-8 py-3 rounded-xl font-semibold transition-all duration-300 glow flex items-center gap-2" style="background:linear-gradient(135deg,var(--gold),#b3822d); color:#20140a;">Xác nhận ${ICON.arrow}</button>`;
        } else if (q.type === "tf") {
          html += `<p class="font-display text-xl font-semibold mb-4" style="color:var(--cream)">${q.q}</p><div class="space-y-3">`;
          q.sub.forEach((item, si) => (html += `<div class="flex flex-col sm:flex-row sm:items-center gap-3 p-3.5 rounded-xl" style="background:rgba(230,224,200,0.035); border:1px solid rgba(230,224,200,0.06);" id="tf-row-${si}"><span class="flex-1 flex items-center gap-2"><span class="w-5 h-5 flex items-center justify-center flex-shrink-0" id="tf-status-${si}"></span>${item.text}</span><div class="flex gap-2" id="tf-${si}"><button class="tf-btn px-5 py-2 rounded-xl text-sm font-semibold" onclick="selectTF(${si},true)">Đúng</button><button class="tf-btn px-5 py-2 rounded-xl text-sm font-semibold" onclick="selectTF(${si},false)">Sai</button></div></div>`));
          html += "</div>"; qArea.innerHTML = html; window._tfSelected = {};
          btnArea.innerHTML = `<button onclick="confirmTF()" class="px-8 py-3 rounded-xl font-semibold transition-all duration-300 glow flex items-center gap-2" style="background:linear-gradient(135deg,var(--gold),#b3822d); color:#20140a;">Xác nhận ${ICON.arrow}</button>`;
        } else if (q.type === "short") {
          html += `<p class="font-display text-xl leading-relaxed mb-4" style="color:var(--cream)">${q.q}</p>
          <div class="flex flex-wrap gap-2 items-center">
            <input id="short-input" type="text" maxlength="${q.maxLen}" class="rounded-xl px-3 py-3 text-lg" style="max-width:240px; background:rgba(230,224,200,0.04); border:1px solid rgba(230,224,200,0.14); color:var(--cream);" placeholder="Nhập đáp án...">
            <span class="text-xs" style="color:var(--muted)" id="char-count">0/${q.maxLen}</span>
          </div>`;
          qArea.innerHTML = html;
          document.getElementById("short-input").addEventListener("input", function(){ document.getElementById("char-count").textContent = this.value.length + "/" + q.maxLen; });
          btnArea.innerHTML = `<button onclick="confirmShort()" class="px-8 py-3 rounded-xl font-semibold transition-all duration-300 glow flex items-center gap-2" style="background:linear-gradient(135deg,var(--gold),#b3822d); color:#20140a;">Xác nhận ${ICON.arrow}</button>`;
        } else if (q.type === "essay") {
          html += `<p class="font-display text-xl leading-relaxed mb-4" style="color:var(--cream)">${q.q}</p><textarea id="essay-input" rows="6" class="w-full rounded-xl p-4 resize-y leading-relaxed" style="background:rgba(230,224,200,0.04); border:1px solid rgba(230,224,200,0.14); color:var(--cream);" placeholder="Nhập câu trả lời của bạn..."></textarea>`;
          qArea.innerHTML = html;
          btnArea.innerHTML = `<button onclick="confirmEssay()" class="px-8 py-3 rounded-xl font-semibold transition-all duration-300 glow flex items-center gap-2" style="background:linear-gradient(135deg,var(--gold),#b3822d); color:#20140a;">Xác nhận ${ICON.arrow}</button>`;
        }
        retriggerAnim();
      }
      function selectMCQ(i) { if (confirmado) return; if (window._mcqSelected !== undefined) document.querySelectorAll("#mcq-opts .opt-btn")[window._mcqSelected].classList.remove("selected"); window._mcqSelected = i; document.querySelectorAll("#mcq-opts .opt-btn")[i].classList.add("selected"); }
      function confirmMCQ() {
        if (window._mcqSelected === undefined) { showFeedback(`${ICON.alert} Vui lòng chọn đáp án.`, "warn"); return; }
        confirmado = true; const q = QUESTIONS[current]; const btns = document.querySelectorAll("#mcq-opts .opt-btn");
        btns.forEach((b, i) => { b.classList.remove("selected"); const badge = b.querySelector(".opt-badge"); if (i === q.ans) { b.classList.add("correct"); badge.innerHTML = ICON.check; } if (i === window._mcqSelected && i !== q.ans) { b.classList.add("wrong"); badge.innerHTML = ICON.x; } b.classList.add("disabled"); b.onclick = null; });
        const ok = window._mcqSelected === q.ans; results[current] = ok;
        showFeedback(ok ? `${ICON.check} <span class="font-semibold">Chính xác!</span>` : `${ICON.x} <span class="font-semibold">Sai.</span> Đáp án: ${q.opts[q.ans]}`, ok ? "good" : "bad");
        showNextBtn();
      }
      function selectTF(si, val) { if (confirmado) return; const btns = document.querySelectorAll(`#tf-${si} button`); btns.forEach((b) => b.classList.remove("selected-true", "selected-false")); btns.forEach((b) => { if (b.textContent === "Đúng") b.classList.toggle("selected-true", val === true); else b.classList.toggle("selected-false", val === false); }); window._tfSelected[si] = val; }
      function confirmTF() {
        const q = QUESTIONS[current]; let all = true; q.sub.forEach((_, si) => { if (window._tfSelected[si] === undefined) all = false; });
        if (!all) { showFeedback(`${ICON.alert} Chọn Đ/S cho tất cả ý.`, "warn"); return; }
        confirmado = true; let correct = 0;
        q.sub.forEach((item, si) => {
          const btns = document.querySelectorAll(`#tf-${si} button`); btns.forEach((b) => { b.classList.remove("selected-true", "selected-false"); const bVal = b.textContent === "Đúng"; b.classList.add(bVal === item.ans ? "reveal-true" : "reveal-false"); b.style.cursor = "default"; b.onclick = null; });
          const status = document.getElementById(`tf-status-${si}`); const userOk = window._tfSelected[si] === item.ans; status.style.color = userOk ? "var(--leaf-bright)" : "var(--rust-bright)"; status.innerHTML = userOk ? ICON.check : ICON.x;
          if (userOk) correct++;
        });
        results[current] = correct;
        showFeedback(`${ICON.check} <span class="font-semibold">Đúng ${correct}/4 ý.</span>`, correct === 4 ? "good" : "warn");
        showNextBtn();
      }
      function confirmShort() {
        const input = document.getElementById("short-input"); const u = input.value.trim();
        if (!u) { showFeedback(`${ICON.alert} Nhập câu trả lời.`, "warn"); return; }
        confirmado = true; const q = QUESTIONS[current];
        const norm = (x) => x.toLowerCase().replace(/[^a-z0-9_\u00e0-\u00ff]/g, "").trim(); const uN = norm(u);
        const ok = q.ansWords.some((w) => norm(w) === uN); results[current] = ok;
        showFeedback(ok ? `${ICON.check} <span class="font-semibold">Chính xác!</span>` : `${ICON.x} <span class="font-semibold">Sai.</span> Đáp án gợi ý: ${q.ansWords[0]}`, ok ? "good" : "bad");
        showNextBtn();
      }
      function confirmEssay() {
        const input = document.getElementById("essay-input"); const u = input.value.trim();
        if (!u) { showFeedback(`${ICON.alert} Nhập câu trả lời.`, "warn"); return; }
        confirmado = true; const q = QUESTIONS[current]; const s = q.sample;
        const norm = (x) => x.replace(/\s+/g, " ").trim().toLowerCase(); const uN = norm(u), sN = norm(s);
        const words = new Set(sN.split(/[^a-z0-9_\u00e0-\u00ff]+/).filter(Boolean)); const uw = uN.split(/[^a-z0-9_\u00e0-\u00ff]+/).filter(Boolean);
        const matched = uw.filter((w) => words.has(w)).length; const ratio = words.size > 0 ? Math.round((matched / words.size) * 100) : 0;
        results[current] = ratio; const tone = ratio >= 80 ? "good" : ratio >= 50 ? "warn" : "bad";
        const barColor = ratio >= 80 ? "var(--leaf)" : ratio >= 50 ? "var(--gold)" : "var(--rust)";
        fbArea.classList.remove("hidden"); fbArea.classList.remove("fade-in"); void fbArea.offsetWidth; fbArea.classList.add("fade-in");
        fbArea.innerHTML = `<div class="rounded-xl p-4 border" style="${tone === "good" ? "color:var(--leaf-bright); background:rgba(95,154,68,0.10); border-color:rgba(95,154,68,0.28);" : tone === "warn" ? "color:var(--gold-bright); background:rgba(207,158,63,0.10); border-color:rgba(207,158,63,0.28);" : "color:var(--rust-bright); background:rgba(182,83,58,0.10); border-color:rgba(182,83,58,0.28);"}">
        <div class="flex items-center gap-2">${ICON.chart}<span class="font-semibold">Độ tương đồng: ${ratio}%</span></div>
        <p class="text-sm mt-1" style="color:var(--muted)">Từ khóa khớp: ${matched}/${words.size}</p>
        <div class="w-full rounded-full h-1.5 mt-2" style="background:rgba(230,224,200,0.08)"><div class="h-full rounded-full transition-all duration-700 ease-out" style="width:${ratio}%; background:${barColor};"></div></div>
        <button onclick="document.getElementById('essay-input').value='${s.replace(/`/g, "\\`").replace(/'/g, "\\'").replace(/\n/g, "\\n")}'" class="mt-3 text-sm underline flex items-center gap-1" style="color:var(--gold-bright)">${ICON.edit} Điền đáp án mẫu</button>
      </div>`; showNextBtn();
      }
      function showNextBtn() {
        const last = current === QUESTIONS.length - 1;
        btnArea.innerHTML = last
          ? `<button onclick="showResults()" class="px-8 py-3 rounded-xl font-semibold transition-all duration-300 glow flex items-center gap-2" style="background:linear-gradient(135deg,var(--leaf),#3f7a2a); color:#0d1a08;">Xem kết quả ${ICON.chart}</button>`
          : `<button onclick="next()" class="px-8 py-3 rounded-xl font-semibold transition-all duration-300 glow flex items-center gap-2" style="background:linear-gradient(135deg,var(--gold),#b3822d); color:#20140a;">Tiếp theo ${ICON.arrow}</button>`;
      }
      function next() { current++; render(); }
      function showResults() {
        let mcqC = 0, mcqT = 0, tfC = 0, tfT = 0, essS = 0, essT = 0, shtC = 0, shtT = 0;
        QUESTIONS.forEach((q, i) => { const r = results[i]; if (r === undefined) return; if (q.type === "mcq") { if (r) mcqC++; mcqT++; } else if (q.type === "tf") { tfC += r; tfT += 4; } else if (q.type === "short") { if (r) shtC++; shtT++; } else if (q.type === "essay") { essS += r; essT++; } });
        qArea.innerHTML = `<div class="text-center py-8">
        <div class="flex justify-center mb-4">${ICON.sprout}</div>
        <h2 class="font-display text-3xl font-semibold" style="color:var(--cream)">Hoàn thành!</h2>
        <p class="mt-2" style="color:var(--muted)">Kết quả làm bài của bạn</p>
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mt-8">
          <div class="glass rounded-2xl p-5"><p class="text-2xl font-bold" style="color:var(--gold-bright)">${mcqC}/${mcqT}</p><p class="text-xs mt-1" style="color:var(--muted)">Trắc nghiệm</p></div>
          <div class="glass rounded-2xl p-5"><p class="text-2xl font-bold" style="color:var(--leaf-bright)">${tfC}/${tfT}</p><p class="text-xs mt-1" style="color:var(--muted)">Đúng / Sai</p></div>
          <div class="glass rounded-2xl p-5"><p class="text-2xl font-bold" style="color:var(--gold-bright)">${shtC}/${shtT}</p><p class="text-xs mt-1" style="color:var(--muted)">Trả lời ngắn</p></div>
          <div class="glass rounded-2xl p-5"><p class="text-2xl font-bold" style="color:var(--cream)">${essT > 0 ? Math.round(essS / essT) + "%" : "--"}</p><p class="text-xs mt-1" style="color:var(--muted)">Tự luận</p></div>
        </div>
      </div>`;
        fbArea.classList.add("hidden");
        btnArea.innerHTML = `<button onclick="restart()" class="px-8 py-3 rounded-xl font-semibold transition-all duration-300 glow flex items-center gap-2" style="background:linear-gradient(135deg,var(--gold),#b3822d); color:#20140a;">Làm lại ${ICON.refresh}</button>`;
        updateProgress(100); retriggerAnim();
      }
      function restart() { current = 0; confirmado = false; results = []; render(); }
      render();
    </script>
  </body>
</html>
